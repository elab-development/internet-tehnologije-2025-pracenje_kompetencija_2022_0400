services:
  db:
    image: postgres:17
    container_name: pracenjekompetencija-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pracenjekompetencija
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        JWT_SECRET: ${JWT_SECRET}
        JWT_EXPIRES: ${JWT_EXPIRES}
        DATABASE_URL: ${DATABASE_URL}
        API_URL: ${API_URL}
    container_name: pracenjekompetencija-app
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    command: npm run dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  pgdata:
  node_modules:
  next_cache: