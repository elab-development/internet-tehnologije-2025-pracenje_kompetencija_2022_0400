
name: CI Pipeline (Automatska provera koda)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # ENV varijable koje su potrebne da build ne pukne
    env:
      DATABASE_URL: "postgres://user:pass@localhost:5432/test_db"
      JWT_SECRET: "test_jwt_secret_123"
      JWT_EXPIRES: "7d"
      API_URL: "http://localhost:3001"

    steps:
      - name: Preuzimanje koda iz repozitorijuma
        uses: actions/checkout@v4

      - name: Instalacija Node.js (verzija 20)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalacija zavisnosti (npm ci)
        run: npm ci

      - name: Provera TypeScript tipova i Build procesa
        run: npm run build

      - name: Pokretanje automatskih testova
        run: npm test